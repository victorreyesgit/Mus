<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">

<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1f6b3a"><link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--bg:#1f6b3a;--panel:#14502a;--ink:#fff;--card:#fffdf4;--cardink:#222;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14452a;--panel:#0d311d;--card:#f3efe0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14452a;--panel:#0d311d;--card:#f3efe0;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:16px}
#menu,#game{max-width:640px;margin:0 auto;height:100%;box-sizing:border-box;padding:8px;display:flex;flex-direction:column;gap:4px}
#game{display:none}
h1{font-size:3.2rem;text-align:center;margin:1rem 0 0}
p.s{text-align:center;font-size:1.2rem;margin:.3rem 1rem}
button{font:inherit;font-weight:700;font-size:1.35rem;min-height:3.6rem;border:0;border-radius:14px;background:#f5efd8;color:#222;padding:.5rem 1rem;cursor:pointer}
button:active{background:#e0d6a8}
#menu button{margin:.4rem 1rem}
#bar{display:flex;justify-content:space-between;align-items:center;background:var(--panel);border-radius:12px;padding:6px 10px;font-size:1.2rem;gap:6px}
#bar b{font-size:1.7rem}
#bar button{min-height:2.4rem;font-size:1rem;padding:.2rem .7rem}
#seats{display:grid;grid-template-columns:1fr 1fr;gap:6px;align-items:start}#seats .p2{grid-column:1/3;grid-row:1;justify-self:center;width:55%}#seats .p3{grid-column:1;grid-row:2}#seats .p1{grid-column:2;grid-row:2}#lc{grid-column:2;grid-row:2;text-align:center;font-size:1.5rem;font-weight:800;align-self:center;color:#d7ffe0}
.seat{background:var(--panel);border-radius:12px;padding:6px;text-align:center;font-size:.9rem}.mano{background:#ffd54a;color:#222;border-radius:10px;padding:0 6px;font-weight:800;white-space:nowrap}.mc{width:28px;height:42px;display:inline-block;border-radius:4px;overflow:hidden;border:1px solid #6b5a2a;background:#fffdf4}.mc svg{width:100%;height:100%;display:block}.mc .lb{display:none}.mc{width:34px;height:51px}.seat{overflow:hidden}.say{overflow-wrap:anywhere;line-height:1.2}#msg{line-height:1.3}#bar{flex-wrap:wrap}#msg{font-size:1.35rem}#msg .say{font-size:1.2rem;margin-bottom:4px}#chips{display:flex;gap:4px}.chip{flex:1;border-radius:8px;padding:3px 2px;text-align:center;font-size:.8rem;font-weight:700;background:#0004;line-height:1.2}.chip.g{background:#2e7d32}.chip.r{background:#b71c1c}.chip.p{outline:2px dashed #fffa}#sum{display:none;position:fixed;inset:0;overflow:auto;background:var(--bg);color:#fff;padding:12px max(12px,calc(50% - 310px));padding-top:calc(12px + env(safe-area-inset-top,0px))}#sum h2{margin:.2rem 0}#sum h3{margin:.8rem 0 .3rem}table{width:100%;border-collapse:collapse;font-size:1rem}td,th{padding:6px;border-bottom:1px solid #fff4;text-align:left;vertical-align:middle}tr.g td{background:#2e7d32}tr.r td{background:#b71c1c}#sum .mc{margin-right:1px;width:30px;height:45px}.jv{font-size:.95rem;flex-basis:100%;text-align:center}.seat.y{background:#c7a6ff;color:#2a1250}.seat.y .say{color:#4a1e8a}.seat.y .mano{background:#2a1250;color:#c7a6ff}#hand.y{outline:4px solid #c7a6ff;outline-offset:4px;border-radius:12px}tr.n td{background:#5a5a5a}.gt{color:#a5ffa5}.rt{color:#ffb0b0}#sum button{width:100%;margin:10px 0 20px}.cnt{display:flex;align-items:center;justify-content:center;gap:10px;font-size:2rem}.cnt button{min-width:0;width:3.4rem;padding:0}#btns button.og{background:#ff8a65}.ex{font-weight:700;margin-top:3px;font-size:.95rem}
.mini{display:flex;gap:2px;justify-content:center;margin:4px 0;flex-wrap:wrap}
.bk{width:18px;height:26px;border-radius:3px;background:#b71c1c;border:2px solid #fff;display:inline-block}
.m{background:var(--card);color:var(--cardink);border-radius:3px;padding:1px 3px;font-size:.8rem;font-weight:700}
.say{font-weight:700;color:#d7ffe0;font-size:1.05rem}
#msg{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.5rem;font-weight:600;padding:4px 8px;overflow:auto}
#hand{display:flex;gap:6px;justify-content:center}
.c{flex:1;max-width:24%;aspect-ratio:2/3;background:#fffdf4;border-radius:10px;border:3px solid;transition:transform .15s;cursor:pointer;overflow:hidden}.c svg{width:100%;height:100%;display:block}
.c .n{font-size:2.6rem;font-weight:800;line-height:1}
.c .nn{font-size:.85rem;font-weight:700;min-height:1.1em}
.c .su{font-size:1rem;font-weight:800}
.s0{border-color:#c28a00;color:#8a6100}.s1{border-color:#c62828;color:#b71c1c}.s2{border-color:#1565c0;color:#0d47a1}.s3{border-color:#2e7d32;color:#1b5e20}
.c.sel{transform:translateY(-16px);box-shadow:0 0 0 4px #ff1744;background:#ffe5e5}
#btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(45%,1fr));gap:8px;min-height:3.6rem}#btns button{min-height:3.2rem;font-size:1.2rem}
#btns{grid-template-columns:repeat(6,1fr);height:calc(6.4rem + 8px);min-height:0;align-content:start}#btns button{padding:.3rem .4rem;font-size:1.1rem}#btns>button{grid-column:span 3}#btns>button:only-child{grid-column:span 6}.cnt{gap:6px}.cnt b{font-size:1.5rem}.cnt button{width:2.8rem}
#msg{min-height:0}#hand{min-height:calc(min(100vw - 16px,624px)*.36)}
.seat .say{font-size:1.2rem;height:1.35em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.seat b{display:block;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ml{min-height:1.6em}.mini{min-height:34px}.seat .mc{width:20px;height:30px}
.chip{height:2.7em;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:.85rem}.chip.r,.chip.g{font-size:.85rem}
@media (max-height:620px){#hand{min-height:0}.c{max-width:17%}}
.seat{padding:4px}.seat .bk{width:13px;height:20px;border:1px solid #fff}.mini{min-height:22px;margin:2px 0}.seat .mc{width:14px;height:21px}.ml{min-height:1.4em}#bar{font-size:1.15rem;padding:4px 10px}#bar b{font-size:1.55rem}.jv{font-size:.85rem;white-space:nowrap;min-height:1.7em;display:flex;justify-content:center;align-items:center;gap:8px}.seat .bk{width:16px;height:24px}.acts{display:flex;flex-wrap:wrap;gap:8px;width:100%;justify-content:center}.act{background:#0006;border-radius:12px;padding:6px 12px;font-size:1.35rem;font-weight:800;line-height:1.2;white-space:nowrap}.act b{font-weight:600;font-size:1rem;opacity:.85;margin-right:6px}.act.me{outline:3px solid #fff}.chip.cur{outline:3px solid #fff}#modal{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;z-index:20;padding:16px}.mbox{background:var(--panel);border-radius:18px;padding:22px;max-width:440px;width:100%;text-align:center;display:flex;flex-direction:column;gap:14px}.mt{font-size:1.9rem;font-weight:800;line-height:1.3}#dif{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:auto 1rem 12px}#menu #dif button{margin:0;min-height:3rem;font-size:1rem;padding:.3rem;background:#0004;color:#fff}#menu #dif button.on{background:#f5efd8;color:#222;outline:3px solid #fff}
</style></head><body>
<div id="menu">
<h1>🃏 Mus</h1>
<p class="s" id="vs" style="font-size:1.6rem"></p>

<button onclick="jugar(DIF)">¡A jugar!</button>
<div id="dif"></div>


</div>
<div id="modal"></div>
<div id="sum"></div>
<div id="game">
<div id="bar"></div>
<div id="chips"></div>
<div id="seats"></div>
<div id="msg"></div>
<div id="hand"></div>
<div id="btns"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const SU=['Oros','Copas','Espadas','Bastos'];
const NM={1:'As',2:'vale As',3:'vale Rey',10:'Sota',11:'Caballo',12:'Rey'};
const NAMES=['Tú','Ramón','Víctor','Carmen'];
const W=['Nosotros','Ellos'];
const tm=p=>p%2, rk=v=>v==3?12:v==2?1:v, pt=v=>(v>=10||v==3)?10:v==2?1:v;
const ord=f=>[0,1,2,3].map(i=>(f+i)%4);
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let G=null, fs=19;
try{fs=+localStorage.getItem('mus_fs')||18}catch(e){}
document.documentElement.style.fontSize=fs+'px';
function zoom(d){fs=Math.min(26,Math.max(14,fs+d));document.documentElement.style.fontSize=fs+'px';try{localStorage.setItem('mus_fs',fs)}catch(e){}}

/* ---- cartas espanolas ---- */
function sym(s,x,y,k){return `<g transform="translate(${x} ${y}) scale(${k})">`+[
'<circle r="11" fill="#f2b705" stroke="#8a5a00" stroke-width="2"/><circle r="6" fill="none" stroke="#8a5a00" stroke-width="1.5"/>',
'<path d="M-10-10h20c0 12-5 17-10 17s-10-5-10-17zM-2 7h4v6h-4zM-7 13h14v3h-14z" fill="#d32f2f" stroke="#7a1010"/>',
'<path d="M0-15L4-4V6H-4V-4z" fill="#cfd8dc" stroke="#37474f"/><rect x="-9" y="6" width="18" height="3" fill="#1565c0"/><rect x="-1.5" y="9" width="3" height="8" fill="#1565c0"/>',
'<rect x="-3" y="-15" width="6" height="30" rx="3" fill="#2e7d32" stroke="#12400f"/><circle cx="-5" cy="-6" r="3.5" fill="#2e7d32" stroke="#12400f"/><circle cx="5" cy="3" r="3.5" fill="#2e7d32" stroke="#12400f"/>'][s]+'</g>'}
const PIPS={1:[[50,75]],2:[[50,38],[50,112]],3:[[50,30],[50,75],[50,120]],4:[[30,40],[70,40],[30,110],[70,110]],5:[[30,40],[70,40],[50,75],[30,110],[70,110]],6:[[30,35],[70,35],[30,75],[70,75],[30,115],[70,115]],7:[[30,35],[70,35],[50,55],[30,75],[70,75],[30,115],[70,115]]};
function horse(s){return `<g stroke="#4a2e12" stroke-width="1.5"><path d="M30 105v24M40 108v22M56 108v22M65 105v24" stroke-width="5" fill="none"/><path d="M21 92Q8 102 13 122" fill="none" stroke="#6b3e12" stroke-width="4"/><ellipse cx="45" cy="96" rx="25" ry="13" fill="#d9a066"/><path d="M62 90L72 62L90 68L87 82L77 84L73 98z" fill="#d9a066"/><path d="M72 62L78 48L83 65z" fill="#d9a066"/><path d="M52 88Q52 62 59 62Q68 62 66 90z" fill="#1565c0"/><circle cx="58" cy="52" r="9" fill="#f5cba7"/><path d="M47 49Q58 32 69 49z" fill="#2e7d32"/></g><circle cx="83" cy="72" r="1.6" fill="#222"/><path d="M54 74Q44 74 37 67" fill="none" stroke="#1565c0" stroke-width="5" stroke-linecap="round"/><circle cx="36" cy="66" r="3.5" fill="#f5cba7" stroke="#4a2e12"/>`+sym(s,35,50,.85)}
function cardSVG(v,s){let b='';
 if(v<10)b=PIPS[v].map(([x,y])=>sym(s,x,y,v==1?2.2:1.15)).join('');
 else if(v==11)b=horse(s);
 else{const col=['#c62828','#1565c0','#6a1b9a'][v-10];
  b=`<path d="M25 125Q25 80 50 80Q75 80 75 125z" fill="${col}"/><circle cx="50" cy="62" r="14" fill="#f5cba7" stroke="#6b4a2a"/>`+(v==12?'<path d="M34 52L38 36L45 46L50 33L55 46L62 36L66 52z" fill="#f2b705" stroke="#8a5a00"/>':v==11?'<path d="M34 52Q50 28 66 52zM60 40Q75 25 78 40" fill="#2e7d32" stroke="#12400f"/>':'<path d="M36 52Q50 34 64 52z" fill="#333"/>')+sym(s,50,110,.9)}
 const lab=v==10?'Sota':v==11?'Caballo':v==12?'Rey':'';
 return `<svg viewBox="0 0 100 150" xmlns="http://www.w3.org/2000/svg">${b}<text x="6" y="18" font-size="17" font-weight="800" fill="#222">${v}</text><text class="lb" x="50" y="146" font-size="9.5" font-weight="700" text-anchor="middle" fill="#222">${lab}</text></svg>`}
/* ---- evaluacion de manos ---- */
const rks=h=>h.map(c=>rk(c.v));
const grande=h=>rks(h).sort((a,b)=>b-a).reduce((a,x)=>a*13+x,0);
const chica=h=>-rks(h).sort((a,b)=>a-b).reduce((a,x)=>a*13+x,0);
function pares(h){const m={};rks(h).forEach(r=>m[r]=(m[r]||0)+1);
 const g=Object.entries(m).map(([r,n])=>[+r,n]).filter(x=>x[1]>1).sort((a,b)=>b[1]-a[1]||b[0]-a[0]);
 if(!g.length)return null;
 if(g[0][1]==4)return{t:3,s:30000+g[0][0]*100+g[0][0]};
 if(g[0][1]==3)return{t:2,s:20000+g[0][0]*100};
 if(g.length==2)return{t:3,s:30000+g[0][0]*100+g[1][0]};
 return{t:1,s:10000+g[0][0]*100}}
const sum=h=>h.reduce((a,c)=>a+pt(c.v),0);
const jv=h=>sum(h)>=31;
const jstr=h=>({31:8,32:7,40:6,37:5,36:4,35:3,34:2,33:1})[sum(h)]||0;
function str(n,h){return n=='Grande'?grande(h):n=='Chica'?chica(h):n=='Pares'?pares(h).s:n=='Juego'?jstr(h):sum(h)}
function sc(n,h){const r=rks(h),k=v=>r.filter(x=>x==v).length,T=[.1,.35,.6,.85,1];
 if(n=='Grande')return Math.min(1,T[k(12)]+k(11)*.04);
 if(n=='Chica')return Math.min(1,T[k(1)]+k(4)*.04);
 if(n=='Pares'){const p=pares(h);return p?[0,.45,.75,.95][p.t]:0}
 if(n=='Juego')return jstr(h)/8;
 return sum(h)/30}

/* ---- jugadores artificiales ---- */
function aiMus(p){const h=G.h[p],k=rks(h).filter(x=>x==12).length,pr=pares(h);
 const good=(jv(h)&&jstr(h)>=6)||k>=3||(pr&&pr.t>=2)||(G.d==2&&pr&&k>=2);
 if(G.d==0)return Math.random()<(good?.5:.2)?'nomus':'mus';
 return good?'nomus':'mus'}
function aiDisc(p){const h=G.h[p],r=rks(h),c={};r.forEach(x=>c[x]=(c[x]||0)+1);
 if(G.d==0)return shuf([0,1,2,3]).slice(0,1+(Math.random()*3|0));
 const idx=[];h.forEach((x,i)=>{const v=r[i];if(!(v==12||c[v]>1||(G.d==2&&v==11&&r.includes(12))))idx.push(i)});return idx}
function aiAct(p,n,mode,amt){
 const d=G.d,x=sc(n,G.h[p])+(Math.random()-.5)*[.5,.2,.08][d],r=Math.random();
 if(mode=='open'){
  if(x>.97&&r<[0,.1,.3][d])return'ordago';
  return(x>[.8,.65,.58][d]||(d==2&&r<.1&&n!='Pares'&&n!='Juego'))?'envido':'paso'}
 if(amt=='O')return x>[.92,.88,.82][d]?'quiero':'no';
 if(x>.97&&r<[0,.1,.3][d])return'ordago';
 if(x>[.85,.78,.72][d]&&amt<8&&r<.6)return'subo';
 return x>[.5,.45,.4][d]?'quiero':'no'}

/* ---- interfaz ---- */
function ask(msg,opts){return new Promise(res=>{G.msg=msg;G.opts=opts;G.res=res;render()})}
function pick(v){const r=G.res;G.opts=[];G.res=null;if(r)r(v);render()}
function tap(i){if(!G.dm)return;const k=G.sel.indexOf(i);k<0?G.sel.push(i):G.sel.splice(k,1);render()}
function info(t){G.msg=t;render()}
function say(p,t){G.say[p]=t;render()}
function render(){
 $('bar').innerHTML=`<span>Nosotros <b>${G.s[0]}</b></span><span>Ellos <b>${G.s[1]}</b></span><span class="jv">${G.mano==0?'<span class="mano">✋ Eres MANO</span> ':''}Juegos ${G.j[0]}-${G.j[1]} · Vacas ${G.v[0]}-${G.v[1]}</span>`;
 $('seats').innerHTML=[3,2,1].map(p=>`<div class="seat p${p}${(G.has||[]).includes(p)?' y':''}"><b>${p==G.mano?`<span class="mano">✋ ${NAMES[p]}</span>`:NAMES[p]}</b><div class="mini">${G.h[p].map(c=>G.rev?`<span class="mc">${cardSVG(c.v,c.s)}</span>`:'<i class="bk"></i>').join('')}</div><div class="say">${G.say[p]||'&nbsp;'}</div></div>`).join('');
 $('msg').innerHTML=(G.say[0]?`<div class="act me">${G.say[0]}</div>`:'')+(G.msg||'');
 $('hand').className=(G.has||[]).includes(0)?'y':'';
 $('chips').innerHTML=['Grande','Chica','Pares','Juego'].map((n,i)=>{const r=(G.rows||[]).find(x=>x.l==i&&!x.b);
  return `<div class="chip${r&&r.done&&r.t!=null?(r.t?' r':' g'):''}${G.lance==n||(i==3&&G.lance=='Punto')?' cur':''}">${r?r.n.split(' ')[0]:n}<br>${r?(r.c||r.bet):'-'}</div>`}).join('');
 $('hand').innerHTML=G.h[0].map((c,i)=>`<div class="c s${c.s}${G.sel.includes(i)?' sel':''}" onclick="tap(${i})">${cardSVG(c.v,c.s)}</div>`).join('');
 $('btns').innerHTML=G.bet&&G.opts.length?betUI():(G.opts||[]).map(([k,l])=>`<button onclick="pick('${k}')">${typeof l=='function'?l():l}</button>`).join('')}
function add(t,p){G.s[t]+=p;render();if(G.s[t]>=40)throw'fin'}

/* ---- reglas ---- */
function draw(){if(!G.deck.length){G.deck=shuf(G.disc);G.disc=[]}return G.deck.pop()}
const sortH=h=>h.sort((a,b)=>rk(b.v)-rk(a.v)||a.s-b.s);
async function humanDisc(){G.sel=[];G.dm=true;
 await ask('',[['ok',()=>G.sel.length?`Cambiar ${G.sel.length} carta${G.sel.length>1?'s':''}`:'No cambiar ninguna']]);
 G.dm=false;const s=[...G.sel];G.sel=[];return s}
async function mus(){
 while(true){
  G.lance='Mus';info('');
  for(const p of ord(G.mano)){
   let a;
   if(p==0)a=await ask('',[['mus','Mus'],['nomus','No hay mus']]);
   else{await sleep(900);a=aiMus(p)}
   say(p,a=='mus'?'Mus':'No hay mus');
   if(a=='nomus'){await sleep(1300);G.say=[];return}
  }
  await sleep(700);G.say=[];info('');
  for(const p of ord(G.mano)){
   const idx=p==0?await humanDisc():aiDisc(p),h=G.h[p];
   [...idx].sort((a,b)=>b-a).forEach(i=>G.disc.push(h.splice(i,1)[0]));
   while(h.length<4)h.push(draw());
   sortH(h);G.say=[];
   if(p) {say(p,idx.length?`Cambio ${idx.length}`:'No cambio');await sleep(800)}
  }
  G.say=[];
 }}
async function act(p,n,mode,amt,owner){
 if(p!=0){await sleep(1000);return aiAct(p,n,mode,amt)}
 if(mode=='open')return ask(`${n}. ¿Qué haces?`,[['paso','Paso (no apuesto)'],['envido','Envido 2 piedras'],['ordago','¡Órdago!']]);
 if(amt=='O')return ask(`¡${NAMES[owner]} lanza un órdago! ¿Quieres?`,[['quiero','Quiero'],['no','No quiero']]);
 const o=[['quiero','Quiero'],['no','No quiero']];if(amt<8)o.push(['subo',`Subo a ${amt+2}`]);o.push(['ordago','¡Órdago!']);
 return ask(`${NAMES[owner]} envida ${amt} piedras. ¿Quieres?`,o)}
async function betting(n,el){
 let first=null,kind;
 for(const p of el){const a=await act(p,n,'open',0);
  if(a=='paso'){say(p,'Paso');continue}
  first=p;kind=a;break}
 if(first===null)return{t:'pass'};
 let owner=first,cur=0,pend=kind=='ordago'?'O':2;
 say(owner,kind=='ordago'?'¡ÓRDAGO!':'Envido 2');
 while(true){
  const r=ord((owner+1)%4).find(p=>el.includes(p)&&tm(p)!=tm(owner));
  const a=await act(r,n,'resp',pend,owner);
  if(a=='no'){say(r,'No quiero');await sleep(600);return{t:'dec',team:tm(owner),pts:Math.max(cur,1)}}
  if(a=='quiero'){say(r,'¡Quiero!');await sleep(600);return pend=='O'?{t:'ord'}:{t:'acc',n:pend}}
  if(a=='ordago'){say(r,'¡ÓRDAGO!');cur=pend;pend='O';owner=r;continue}
  say(r,`Subo a ${pend+2}`);cur=pend;pend+=2;owner=r}}
async function playLance(n){
 const o=ord(G.mano);G.say=[];G.lance=n;let el=o;
 if(n=='Pares'){el=o.filter(p=>pares(G.h[p]));info('Pares: '+(el.length?'tienen '+el.map(p=>NAMES[p]).join(', '):'nadie tiene'));await sleep(2200);if(!el.length)return}
 if(n=='Juego'){el=o.filter(p=>jv(G.h[p]));

function pintaDif(){$('dif').innerHTML=['Fácil','Normal','Difícil','Experto','Perfecto'].map((t,i)=>`<button class="${i==DIF?'on':''}" onclick="setDif(${i})">${t}</button>`).join('')}
function gwin(a,b){if(a>=40)return 1;if(b>=40)return 0;const r=((40-a)+(40-b))/2;return 1/(1+Math.exp(-1.7*(a-b)/(3*Math.sqrt(r))))}
function ST(p){G.st=G.st||[0,1,2,3].map(()=>({o:0,b:0,r:0,a:0,u:0,s:0}));return G.st[p]}
function lik(n,q,h,mod){const pb=G.pub[n]&&G.pub[n][q],s=sc(n,h),st=ST(q),br=mod?(st.u+.5)/(st.s+3):.08;let L=1;
 if(pb=='paso')L*=.3+.7*(1-s);else if(pb=='no')L*=.2+.8*(1-s);else if(pb=='quiero')L*=.25+.75*s;else if(pb)L*=br+(1-br)*(.12+.88*s);
 const ql=Math.max(sc('Grande',h),sc('Chica',h),sc('Pares',h),sc('Juego',h)),dn=G.dn[q];
 if(dn===0)L*=.15+.85*ql;else if(dn===1)L*=.4+.6*ql;
 if(G.cut===q)L*=.25+.75*ql;return L}
function wpi(p,n,N,inf,mod){const mine=G.h[p],ks=new Set(mine.map(x=>x.v+'-'+x.s)),un=[];
 for(let s=0;s<4;s++)for(const v of[1,2,3,4,5,6,7,10,11,12])if(!ks.has(v+'-'+s))un.push({v,s});
 const has=h=>n=='Pares'?!!pares(h):n=='Juego'?jv(h):true,o=ord(G.mano);let W=0,S=0;
 for(let i=0;i<N;i++){const u=shuf([...un]),hs={};let k=0,wt=1;
  for(let q=0;q<4;q++){hs[q]=q==p?mine:u.slice(4*k++,4*k);if(inf&&q!=p)wt*=lik(n,q,hs[q],mod)}
  let b=null;for(const q of o){if(!has(hs[q]))continue;if(b===null||str(n,hs[q])>str(n,hs[b]))b=q}
  S+=wt;if(b!==null&&tm(b)==tm(p))W+=wt}
 return S>1e-9?W/S:.5}
function pAcc(p,mod){if(!mod)return .62;const o=[0,1,2,3].filter(q=>tm(q)!=tm(p));return o.reduce((a,q)=>{const s=ST(q);return a+(s.a+4)/(s.r+6.15)},0)/o.length}
function aiAct(p,n,mode,amt){
 const d=G.d,t=tm(p),me=G.s[t],op=G.s[1-t],g=gwin(me,op),W=(a,b)=>gwin(me+a,op+b),r=Math.random();
 let w=d==0?sc(n,G.h[p])+(r-.5)*.3:wpi(p,n,[0,70,150,250,420][d],d>=2,d>=3);
 w=Math.min(1,Math.max(0,w+(Math.random()-.5)*[.3,.14,.08,.03,0][d]));
 if(d==0){if(mode=='open')return w>.75?'e2':'paso';if(amt=='O')return w>.9?'quiero':'no';return w>.5?'quiero':'no'}
 const pa=pAcc(p,d>=3),lam=.003+.005*(1-Math.min(1,Math.max(me,op)/27)),adv=k=>Math.max(0,w-k*Math.min(1,3*(1-w))),best=o=>Object.entries(o).sort((a,b)=>b[1]-a[1])[0][0];
 const vWin=(S,x)=>x*W(S,0)+(1-x)*W(0,S),vBet=(S,q)=>q*vWin(S,adv(.15))+(1-q)*W(1,0)-lam*S,vOrd=q=>q*adv(.3)+(1-q)*W(1,0)-(Math.max(me,op)<20?.2:Math.max(me,op)<30?.06:0);
 if(mode=='open')return best({paso:(n=='Pares'||n=='Juego')?g:vWin(1,w),e2:vBet(2,pa),e5:vBet(5,pa*.85),ordago:vOrd(pa*.4)});
 const c=Math.max(1,G.cur||0),vd=W(0,c);
 if(amt=='O')return w>vd?'quiero':'no';
 const o={quiero:vWin(amt,w),no:vd,ordago:vOrd(pa*.4)};
 if(amt<26){const wa=adv(.2);o.r2=pa*vWin(amt+2,wa)+(1-pa)*W(amt,0)-lam*2;o.r5=pa*.8*vWin(amt+5,wa)+(1-pa*.8)*W(amt,0)-lam*5}
 return best(o)}
function aiMus(p){const h=G.h[p],d=G.d,b=Math.max(sc('Grande',h),sc('Chica',h),sc('Pares',h),sc('Juego',h));
 if(d==0)return Math.random()<(b>=.85?.6:.2)?'nomus':'mus';
 if(Math.max(G.s[0],G.s[1])>=30)return'nomus';
 return b>=[0,.85,.75,.72,.7][d]?'nomus':'mus'}
/* ---- IA v3: descarte por valor esperado, lo declarado (pares/juego) es informacion, extras en el valor ---- */
const lv=p=>G.dT?G.dT[tm(p)]:G.d;
function lik(n,q,h,mod){const st=ST(q),br=mod?(st.u+1)/(st.s+12):.08;let L=1;
 for(const m in G.pub){const pb=G.pub[m][q];if(!pb)continue;const s=sc(m,h);
  if(pb=='paso')L*=.3+.7*(1-s);else if(pb=='no')L*=.2+.8*(1-s);else if(pb=='quiero')L*=.25+.75*s;else L*=br+(1-br)*(.12+.88*s)}
 const ql=Math.max(sc('Grande',h),sc('Chica',h),sc('Pares',h),sc('Juego',h)),dn=G.dn[q];
 if(dn===0)L*=.15+.85*ql;else if(dn===1)L*=.4+.6*ql;
 if(G.cut===q)L*=.25+.75*ql;return L}
function wpi(p,n,N,inf,mod){const mine=G.h[p],ks=new Set(mine.map(x=>x.v+'-'+x.s)),un=[];
 for(let s=0;s<4;s++)for(const v of[1,2,3,4,5,6,7,10,11,12])if(!ks.has(v+'-'+s))un.push({v,s});
 const has=h=>n=='Pares'?!!pares(h):n=='Juego'?jv(h):true,o=ord(G.mano),D=G.dec||{};
 const okc=(q,h)=>(!D.Pares||!!pares(h)==D.Pares.includes(q))&&(!D.Juego||jv(h)==D.Juego.includes(q));let W=0,S=0;
 for(let i=0;i<N;i++){let hs,t=0,ok;
  do{const u=shuf([...un]);hs={};let k=0;for(let q=0;q<4;q++)hs[q]=q==p?mine:u.slice(4*k++,4*k);ok=[0,1,2,3].every(q=>q==p||okc(q,hs[q]));t++}while(!ok&&t<30);
  if(!ok)continue;
  let wt=1;if(inf)for(let q=0;q<4;q++)if(q!=p)wt*=lik(n,q,hs[q],mod);
  let b=null;for(const q of o){if(!has(hs[q]))continue;if(b===null||str(n,hs[q])>str(n,hs[b]))b=q}
  S+=wt;if(b!==null&&tm(b)==tm(p))W+=wt}
 return S>1e-9?W/S:.5}
function hv(h){const pr=pares(h);return sc('Grande',h)+sc('Chica',h)+1.3*(pr?[0,.7,1.1,1.5][pr.t]:0)+1.6*(jv(h)?jstr(h)/8+.3:sum(h)/60)}
function bestDisc(p,N){const h=G.h[p],ks=new Set(h.map(x=>x.v+'-'+x.s)),un=[];
 for(let s=0;s<4;s++)for(const v of[1,2,3,4,5,6,7,10,11,12])if(!ks.has(v+'-'+s))un.push({v,s});
 let bi=[],bv=-1;
 for(let m=0;m<16;m++){const keep=h.filter((_,i)=>!(m>>i&1)),nd=4-keep.length;let tot=0;
  if(!nd)tot=hv(h);else{for(let t=0;t<N;t++)tot+=hv(keep.concat(shuf([...un]).slice(0,nd)));tot/=N}
  if(tot>bv+1e-9){bv=tot;bi=[0,1,2,3].filter(i=>m>>i&1)}}
 return{idx:bi,v:bv}}
function aiDisc(p){const d=lv(p),h=G.h[p],r=rks(h),c={};r.forEach(x=>c[x]=(c[x]||0)+1);
 if(d>=2)return bestDisc(p,[0,0,30,50,80][d]).idx;
 if(d==0)return shuf([0,1,2,3]).slice(0,1+(Math.random()*3|0));
 const idx=[];h.forEach((x,i)=>{const v=r[i];if(!(v==12||c[v]>1))idx.push(i)});return idx}
function aiMus(p){const h=G.h[p],d=lv(p),b=Math.max(sc('Grande',h),sc('Chica',h),sc('Pares',h),sc('Juego',h));
 if(d==0)return Math.random()<(b>=.85?.6:.2)?'nomus':'mus';
 if(Math.max(G.s[0],G.s[1])>=30)return'nomus';
 if(d<2)return b>=.85?'nomus':'mus';
 return hv(h)>=bestDisc(p,40).v-.05?'nomus':'mus'}
function exv(p,L){const dl=(G.dec&&G.dec[L])||[],t=tm(p);let a=0,b=0;
 for(const q of dl){const v=q==p?(L=='Pares'?pares(G.h[p]).t:(sum(G.h[p])==31?3:2)):(L=='Pares'?1.4:2.4);if(tm(q)==t)a+=v;else b+=v}return[a,b]}
function aiAct(p,n,mode,amt){
 const d=lv(p),t=tm(p),me=G.s[t],op=G.s[1-t],W=(a,b)=>gwin(me+a,op+b),r=Math.random();
 let w=d==0?sc(n,G.h[p])+(r-.5)*.3:wpi(p,n,[0,70,160,320,600][d],d>=2,d>=3);
 w=Math.min(1,Math.max(0,w+(Math.random()-.5)*[.3,.14,.08,.03,0][d]));
 if(d==0){if(mode=='open')return w>.75?'e2':'paso';if(amt=='O')return w>.9?'quiero':'no';return w>.5?'quiero':'no'}
 const pa=pAcc(p,d>=3),lam=.003+.005*(1-Math.min(1,Math.max(me,op)/27)),adv=k=>Math.max(0,w-k*Math.min(1,3*(1-w))),best=o=>Object.entries(o).sort((a,b)=>b[1]-a[1])[0][0];
 const [Em,Eo]=(n=='Pares'||n=='Juego')?exv(p,n):[0,0];
 const vWin=(S,x)=>x*W(S+Em,0)+(1-x)*W(0,S+Eo),vBet=(S,q)=>q*vWin(S,adv(.15))+(1-q)*W(1+Em,0)-lam*S,vOrd=q=>q*adv(.3)+(1-q)*W(1+Em,0)-(Math.max(me,op)<20?.2:Math.max(me,op)<30?.06:0);
 if(mode=='open')return best({paso:(n=='Pares'||n=='Juego')?vWin(0,w):vWin(1,w),e2:vBet(2,pa),e5:vBet(5,pa*.85),ordago:vOrd(pa*.4)});
 const c=Math.max(1,G.cur||0),vd=W(0,c+Eo);
 if(amt=='O')return w>vd?'quiero':'no';
 const o={quiero:vWin(amt,w),no:vd,ordago:vOrd(pa*.4)},wa=adv(.2);
 if(amt<26){o.r2=pa*vWin(amt+2,wa)+(1-pa)*W(amt+Em,0)-lam*2;o.r5=pa*.8*vWin(amt+5,wa)+(1-pa*.8)*W(amt+Em,0)-lam*5}
 return best(o)}
/* lo que se deduce del mus: cuantas cartas cambio cada uno y quien dijo mus justo antes del corte */
function lik(n,q,h,mod){const st=ST(q),br=mod?(st.u+1)/(st.s+12):.08,on=!G.flag||G.flag[tm(G.ep)];let L=1;
 for(const m in G.pub){const pb=G.pub[m][q];if(!pb)continue;const s=sc(m,h);
  if(pb=='paso')L*=.3+.7*(1-s);else if(pb=='no')L*=.2+.8*(1-s);else if(pb=='quiero')L*=.25+.75*s;else L*=br+(1-br)*(.12+.88*s)}
 const ql=Math.max(sc('Grande',h),sc('Chica',h),sc('Pares',h),sc('Juego',h)),dn=G.dn[q];
 if(dn===0)L*=.15+.85*ql;else if(dn===1)L*=.4+.6*ql;else if(on&&dn===2)L*=.7+.3*ql;
 if(G.cut===q)L*=.25+.75*ql;else if(on&&G.cut!=null&&G.musd&&G.musd[q]===G.rnd)L*=.45+.55*(1-ql);
 return L}
const _wpi=wpi;wpi=(p,...a)=>{G.ep=p;return _wpi(p,...a)};
const _act=act;act=async(p,n,mode,amt,owner)=>{const a=(p==0&&G.auto)?aiAct(p,n,mode,amt):await _act(p,n,mode,amt,owner);(G.pub[n]=G.pub[n]||{})[p]=a;const s=ST(p);if(mode=='open'){s.o++;if(a!='paso')s.b++}else{s.r++;if(a!='no')s.a++}return a};
const _bt=betting;betting=async(n,el)=>{const x=await _bt(n,el);if(x.t=='acc'||x.t=='ord')G.shown.push([G.bettor,n]);return x};
const _cm=cambia;cambia=(p,i)=>{if(p==G.mano)G.rnd=(G.rnd||0)+1;G.dn[p]=i.length;_cm(p,i)};
const _sy=say;say=(p,t)=>{if(t=='No hay mus')G.cut=p;if(t=='Mus'){G.musd=G.musd||[];G.musd[p]=G.rnd||0}_sy(p,t)};
const _sm=summary;summary=async()=>{G.shown.forEach(([p,n])=>{const s=ST(p);s.s++;if(sc(n,G.h[p])<.35)s.u++});return _sm()};
nuevosRivales();pintaDif();
