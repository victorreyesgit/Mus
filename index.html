<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mus</title>
<style>
:root{--bg:#1f6b3a;--panel:#14502a;--ink:#fff;--card:#fffdf4;--cardink:#222;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14452a;--panel:#0d311d;--card:#f3efe0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14452a;--panel:#0d311d;--card:#f3efe0;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:16px}
#menu,#game{max-width:640px;margin:0 auto;height:100%;box-sizing:border-box;padding:8px;display:flex;flex-direction:column;gap:4px}
#game{display:none}
h1{font-size:3.2rem;text-align:center;margin:1rem 0 0}
p.s{text-align:center;font-size:1.2rem;margin:.3rem 1rem}
button{font:inherit;font-weight:700;font-size:1.35rem;min-height:3.6rem;border:0;border-radius:14px;background:#f5efd8;color:#222;padding:.5rem 1rem;cursor:pointer}
button:active{background:#e0d6a8}
#menu button{margin:.4rem 1rem}
#bar{display:flex;justify-content:space-between;align-items:center;background:var(--panel);border-radius:12px;padding:6px 10px;font-size:1.2rem;gap:6px}
#bar b{font-size:1.7rem}
#bar button{min-height:2.4rem;font-size:1rem;padding:.2rem .7rem}
#seats{display:grid;grid-template-columns:1fr 1fr;gap:6px;align-items:start}#seats .p2{grid-column:1/3;grid-row:1;justify-self:center;width:55%}#seats .p3{grid-column:1;grid-row:2}#seats .p1{grid-column:2;grid-row:2}#lc{grid-column:2;grid-row:2;text-align:center;font-size:1.5rem;font-weight:800;align-self:center;color:#d7ffe0}
.seat{background:var(--panel);border-radius:12px;padding:6px;text-align:center;font-size:.9rem}.mano{background:#ffd54a;color:#222;border-radius:10px;padding:0 6px;font-weight:800;white-space:nowrap}.mc{width:28px;height:42px;display:inline-block;border-radius:4px;overflow:hidden;border:1px solid #6b5a2a;background:#fffdf4}.mc svg{width:100%;height:100%;display:block}.mc .lb{display:none}.mc{width:34px;height:51px}.seat{overflow:hidden}.say{overflow-wrap:anywhere;line-height:1.2}#msg{line-height:1.3}#bar{flex-wrap:wrap}#msg{font-size:1.35rem}#msg .say{font-size:1.2rem;margin-bottom:4px}#chips{display:flex;gap:4px}.chip{flex:1;border-radius:8px;padding:3px 2px;text-align:center;font-size:.8rem;font-weight:700;background:#0004;line-height:1.2}.chip.g{background:#2e7d32}.chip.r{background:#b71c1c}.chip.p{outline:2px dashed #fffa}#sum{display:none;position:fixed;inset:0;z-index:25;overflow:auto;background:var(--bg);color:#fff;padding:12px max(12px,calc(50% - 310px));padding-top:calc(12px + env(safe-area-inset-top,0px))}#sum h2{margin:.2rem 0}#sum h3{margin:.8rem 0 .3rem}table{width:100%;border-collapse:collapse;font-size:1rem}td,th{padding:6px;border-bottom:1px solid #fff4;text-align:left;vertical-align:middle}tr.g td{background:#2e7d32}tr.r td{background:#b71c1c}#sum .mc{margin-right:1px;width:30px;height:45px}.jv{font-size:.95rem;flex-basis:100%;text-align:center}.seat.y{background:#c7a6ff;color:#2a1250}.seat.y .say{color:#4a1e8a}.seat.y .mano{background:#2a1250;color:#c7a6ff}#hand.y{outline:4px solid #c7a6ff;outline-offset:4px;border-radius:12px}tr.n td{background:#5a5a5a}.gt{color:#a5ffa5}.rt{color:#ffb0b0}#sum button{width:100%;margin:10px 0 20px}.cnt{display:flex;align-items:center;justify-content:center;gap:10px;font-size:2rem}.cnt button{min-width:0;width:3.4rem;padding:0}#btns button.og{background:#ff8a65}.ex{font-weight:700;margin-top:3px;font-size:.95rem}
.mini{display:flex;gap:2px;justify-content:center;margin:4px 0;flex-wrap:wrap}
.bk{width:18px;height:26px;border-radius:3px;background:#b71c1c;border:2px solid #fff;display:inline-block}
.m{background:var(--card);color:var(--cardink);border-radius:3px;padding:1px 3px;font-size:.8rem;font-weight:700}
.say{font-weight:700;color:#d7ffe0;font-size:1.05rem}
#msg{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.5rem;font-weight:600;padding:4px 8px;overflow:auto}
#hand{display:flex;gap:6px;justify-content:center}
.c{flex:1;max-width:24%;aspect-ratio:2/3;background:#fffdf4;border-radius:10px;border:3px solid;transition:transform .15s;cursor:pointer;overflow:hidden}.c svg{width:100%;height:100%;display:block}
.c .n{font-size:2.6rem;font-weight:800;line-height:1}
.c .nn{font-size:.85rem;font-weight:700;min-height:1.1em}
.c .su{font-size:1rem;font-weight:800}
.s0{border-color:#c28a00;color:#8a6100}.s1{border-color:#c62828;color:#b71c1c}.s2{border-color:#1565c0;color:#0d47a1}.s3{border-color:#2e7d32;color:#1b5e20}
.c.sel{transform:translateY(-16px);box-shadow:0 0 0 4px #ff1744;background:#ffe5e5}
#btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(45%,1fr));gap:8px;min-height:3.6rem}#btns button{min-height:3.2rem;font-size:1.2rem}
#btns{grid-template-columns:repeat(6,1fr);height:calc(6.4rem + 8px);min-height:0;align-content:start}#btns button{padding:.3rem .4rem;font-size:1.1rem}#btns>button{grid-column:span 3}#btns>button:only-child{grid-column:span 6}.cnt{gap:6px}.cnt b{font-size:1.5rem}.cnt button{width:2.8rem}
#msg{min-height:0}#hand{min-height:calc(min(100vw - 16px,624px)*.36)}
.seat .say{font-size:1.2rem;height:1.35em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.seat b{display:block;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ml{min-height:1.6em}.mini{min-height:34px}.seat .mc{width:20px;height:30px}
.chip{height:2.7em;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:.85rem}.chip.r,.chip.g{font-size:.85rem}
@media (max-height:620px){#hand{min-height:0}.c{max-width:17%}}
.seat{padding:4px}.seat .bk{width:13px;height:20px;border:1px solid #fff}.mini{min-height:22px;margin:2px 0}.seat .mc{width:14px;height:21px}.ml{min-height:1.4em}#bar{font-size:1.15rem;padding:4px 10px}#bar b{font-size:1.55rem}.jv{font-size:.85rem;white-space:nowrap;min-height:1.7em;display:flex;justify-content:center;align-items:center;gap:8px}.seat .bk{width:16px;height:24px}.acts{display:flex;flex-wrap:wrap;gap:8px;width:100%;justify-content:center}.act{background:#0006;border-radius:12px;padding:6px 12px;font-size:1.35rem;font-weight:800;line-height:1.2;white-space:nowrap}.act b{font-weight:600;font-size:1rem;opacity:.85;margin-right:6px}.act.me{outline:3px solid #fff}.chip.cur{outline:3px solid #fff}#modal{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;z-index:20;padding:16px}.mbox{background:var(--panel);border-radius:18px;padding:22px;max-width:440px;width:100%;text-align:center;display:flex;flex-direction:column;gap:14px}.mt{font-size:1.9rem;font-weight:800;line-height:1.3}#dif{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:auto 1rem 12px}#menu #dif button{margin:0;min-height:3rem;font-size:1rem;padding:.3rem;background:#0004;color:#fff}#menu #dif button.on{background:#f5efd8;color:#222;outline:3px solid #fff}
#game{position:relative}#cartel{display:none;position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);z-index:15;width:min(88%,420px);background:var(--panel);border:3px solid #ffd54a;border-radius:18px;padding:14px 16px;text-align:center;font-size:1.35rem;font-weight:800;line-height:1.25;box-shadow:0 6px 24px #0008;pointer-events:none}
#btns{height:calc(8rem + 8px)}#btns.bet{grid-template-rows:4.6rem 3.4rem}#btns.bet button{min-height:0}#btns.bet .big,#btns.bet .env{font-size:1.6rem;font-weight:800}#btns.bet .cnt b{font-size:2.1rem}#btns.bet .cnt button{width:3rem;height:100%}#btns.bet .og{font-size:1.2rem}#btns.bet button{white-space:nowrap}#btns.bet .env{font-size:1.45rem}#btns.bet button{font-size:1.3rem}#btns.bet .cnt button{font-size:1.8rem}#btns.bet .env{background:#ffd54a;color:#222}
</style></head><body>
<div id="menu">
<h1>🃏 Mus</h1>
<p class="s" id="vs" style="font-size:1.6rem"></p>

<button onclick="jugar(DIF)">¡A jugar!</button>
<div id="dif"></div>


</div>
<div id="modal"></div>
<div id="sum"></div>
<div id="game">
<div id="cartel"></div>
<div id="bar"></div>
<div id="chips"></div>
<div id="seats"></div>
<div id="msg"></div>
<div id="hand"></div>
<div id="btns"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const SU=['Oros','Copas','Espadas','Bastos'];
const NM={1:'As',2:'vale As',3:'vale Rey',10:'Sota',11:'Caballo',12:'Rey'};
const NAMES=['Tú','Ramón','Víctor','Carmen'];
const W=['Nosotros','Ellos'];
const tm=p=>p%2, rk=v=>v==3?12:v==2?1:v, pt=v=>(v>=10||v==3)?10:v==2?1:v;
const ord=f=>[0,1,2,3].map(i=>(f+i)%4);
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let G=null, fs=19;
try{fs=+localStorage.getItem('mus_fs')||18}catch(e){}
document.documentElement.style.fontSize=fs+'px';
function zoom(d){fs=Math.min(26,Math.max(14,fs+d));document.documentElement.style.fontSize=fs+'px';try{localStorage.setItem('mus_fs',fs)}catch(e){}}

/* ---- cartas espanolas ---- */
function sym(s,x,y,k){return `<g transform="translate(${x} ${y}) scale(${k})">`+[
'<circle r="11" fill="#f2b705" stroke="#8a5a00" stroke-width="2"/><circle r="6" fill="none" stroke="#8a5a00" stroke-width="1.5"/>',
'<path d="M-10-10h20c0 12-5 17-10 17s-10-5-10-17zM-2 7h4v6h-4zM-7 13h14v3h-14z" fill="#d32f2f" stroke="#7a1010"/>',
'<path d="M0-15L4-4V6H-4V-4z" fill="#cfd8dc" stroke="#37474f"/><rect x="-9" y="6" width="18" height="3" fill="#1565c0"/><rect x="-1.5" y="9" width="3" height="8" fill="#1565c0"/>',
'<rect x="-3" y="-15" width="6" height="30" rx="3" fill="#2e7d32" stroke="#12400f"/><circle cx="-5" cy="-6" r="3.5" fill="#2e7d32" stroke="#12400f"/><circle cx="5" cy="3" r="3.5" fill="#2e7d32" stroke="#12400f"/>'][s]+'</g>'}
const PIPS={1:[[50,75]],2:[[50,38],[50,112]],3:[[50,30],[50,75],[50,120]],4:[[30,40],[70,40],[30,110],[70,110]],5:[[30,40],[70,40],[50,75],[30,110],[70,110]],6:[[30,35],[70,35],[30,75],[70,75],[30,115],[70,115]],7:[[30,35],[70,35],[50,55],[30,75],[70,75],[30,115],[70,115]]};
function horse(s){return `<g stroke="#4a2e12" stroke-width="1.5"><path d="M30 105v24M40 108v22M56 108v22M65 105v24" stroke-width="5" fill="none"/><path d="M21 92Q8 102 13 122" fill="none" stroke="#6b3e12" stroke-width="4"/><ellipse cx="45" cy="96" rx="25" ry="13" fill="#d9a066"/><path d="M62 90L72 62L90 68L87 82L77 84L73 98z" fill="#d9a066"/><path d="M72 62L78 48L83 65z" fill="#d9a066"/><path d="M52 88Q52 62 59 62Q68 62 66 90z" fill="#1565c0"/><circle cx="58" cy="52" r="9" fill="#f5cba7"/><path d="M47 49Q58 32 69 49z" fill="#2e7d32"/></g><circle cx="83" cy="72" r="1.6" fill="#222"/><path d="M54 74Q44 74 37 67" fill="none" stroke="#1565c0" stroke-width="5" stroke-linecap="round"/><circle cx="36" cy="66" r="3.5" fill="#f5cba7" stroke="#4a2e12"/>`+sym(s,35,50,.85)}
function cardSVG(v,s){let b='';
 if(v<10)b=PIPS[v].map(([x,y])=>sym(s,x,y,v==1?2.2:1.15)).join('');
 else if(v==11)b=horse(s);
 else{const col=['#c62828','#1565c0','#6a1b9a'][v-10];
  b=`<path d="M25 125Q25 80 50 80Q75 80 75 125z" fill="${col}"/><circle cx="50" cy="62" r="14" fill="#f5cba7" stroke="#6b4a2a"/>`+(v==12?'<path d="M34 52L38 36L45 46L50 33L55 46L62 36L66 52z" fill="#f2b705" stroke="#8a5a00"/>':v==11?'<path d="M34 52Q50 28 66 52zM60 40Q75 25 78 40" fill="#2e7d32" stroke="#12400f"/>':'<path d="M36 52Q50 34 64 52z" fill="#333"/>')+sym(s,50,110,.9)}
 const lab=v==10?'Sota':v==11?'Caballo':v==12?'Rey':'';
 return `<svg viewBox="0 0 100 150" xmlns="http://www.w3.org/2000/svg">${b}<text x="6" y="18" font-size="17" font-weight="800" fill="#222">${v}</text><text class="lb" x="50" y="146" font-size="9.5" font-weight="700" text-anchor="middle" fill="#222">${lab}</text></svg>`}
/* ---- evaluacion de manos ---- */
const rks=h=>h.map(c=>rk(c.v));
const grande=h=>rks(h).sort((a,b)=>b-a).reduce((a,x)=>a*13+x,0);
const chica=h=>-rks(h).sort((a,b)=>a-b).reduce((a,x)=>a*13+x,0);
function pares(h){const m={};rks(h).forEach(r=>m[r]=(m[r]||0)+1);
 const g=Object.entries(m).map(([r,n])=>[+r,n]).filter(x=>x[1]>1).sort((a,b)=>b[1]-a[1]||b[0]-a[0]);
 if(!g.length)return null;
 if(g[0][1]==4)return{t:3,s:30000+g[0][0]*100+g[0][0]};
 if(g[0][1]==3)return{t:2,s:20000+g[0][0]*100};
 if(g.length==2)return{t:3,s:30000+g[0][0]*100+g[1][0]};
 return{t:1,s:10000+g[0][0]*100}}
const sum=h=>h.reduce((a,c)=>a+pt(c.v),0);
const jv=h=>sum(h)>=31;
const jstr=h=>({31:8,32:7,40:6,37:5,36:4,35:3,34:2,33:1})[sum(h)]||0;
function str(n,h){return n=='Grande'?grande(h):n=='Chica'?chica(h):n=='Pares'?pares(h).s:n=='Juego'?jstr(h):sum(h)}
function sc(n,h){const r=rks(h),k=v=>r.filter(x=>x==v).length,T=[.1,.35,.6,.85,1];
 if(n=='Grande')return Math.min(1,T[k(12)]+k(11)*.04);
 if(n=='Chica')return Math.min(1,T[k(1)]+k(4)*.04);
 if(n=='Pares'){const p=pares(h);return p?[0,.45,.75,.95][p.t]:0}
 if(n=='Juego')return jstr(h)/8;
 return sum(h)/30}

/* ---- jugadores artificiales ---- */




/* ---- interfaz ---- */
function ask(msg,opts){return new Promise(res=>{G.msg=msg;G.opts=opts;G.res=res;render()})}
function pick(v){if(Date.now()<(window.btnLock||0))return;const r=G.res;G.opts=[];G.res=null;G.msg='';G.card='';if(r)r(v);render()}
function tap(i){if(!G.dm)return;const k=G.sel.indexOf(i);k<0?G.sel.push(i):G.sel.splice(k,1);render()}
function info(t){G.msg=t;render()}
function say(p,t){G.say[p]=t;render()}
function render(){
 $('bar').innerHTML=`<span>Nosotros <b>${G.s[0]}</b></span><span>Ellos <b>${G.s[1]}</b></span><span class="jv">${G.mano==0?'<span class="mano">✋ Eres MANO</span> ':''}Juegos ${G.j[0]}-${G.j[1]} · Vacas ${G.v[0]}-${G.v[1]}</span>`;
 $('seats').innerHTML=[3,2,1].map(p=>`<div class="seat p${p}${(G.has||[]).includes(p)?' y':''}"><b>${p==G.mano?`<span class="mano">✋ ${NAMES[p]}</span>`:NAMES[p]}</b><div class="mini">${G.h[p].map(c=>G.rev?`<span class="mc">${cardSVG(c.v,c.s)}</span>`:'<i class="bk"></i>').join('')}</div><div class="say">${G.say[p]||'&nbsp;'}</div></div>`).join('');
 $('msg').innerHTML=(G.say[0]?`<div class="act me">${G.say[0]}</div>`:'')+(G.msg||'');
 $('cartel').style.display=G.card?'block':'none';$('cartel').innerHTML=G.card||'';if(G.card){const m=$('msg');$('cartel').style.top=(m.offsetTop+m.offsetHeight/2)+'px'}
 $('hand').className=(G.has||[]).includes(0)?'y':'';
 $('chips').innerHTML=['Grande','Chica','Pares','Juego'].map((n,i)=>{const r=(G.rows||[]).find(x=>x.l==i&&!x.b);
  return `<div class="chip${r&&r.done&&r.t!=null?(r.t?' r':' g'):''}${G.lance==n||(i==3&&G.lance=='Punto')?' cur':''}">${r?r.n.split(' ')[0]:n}<br>${r?(r.c||r.bet):'-'}</div>`}).join('');
 $('hand').innerHTML=G.h[0].map((c,i)=>`<div class="c s${c.s}${G.sel.includes(i)?' sel':''}" onclick="tap(${i})">${cardSVG(c.v,c.s)}</div>`).join('');
 {const key=(G.bet?G.bet.mode:'')+'|'+(G.opts||[]).map(o=>o[0]).join();if(key!==window.btnKey){window.btnKey=key;window.btnLock=Date.now()+500}}/* botones nuevos: ignora toques 0,5 s para no pulsar sin querer por un toque anterior */
 $('btns').className=G.bet&&G.opts.length?'bet':'';$('btns').innerHTML=G.bet&&G.opts.length?betUI():(G.opts||[]).map(([k,l])=>`<button onclick="pick('${k}')">${typeof l=='function'?l():l}</button>`).join('')}
function add(t,p){G.s[t]+=p;render();if(G.s[t]>=40)throw'fin'}

/* ---- reglas ---- */
function draw(){if(!G.deck.length){G.deck=shuf(G.disc);G.disc=[]}return G.deck.pop()}
const sortH=h=>h.sort((a,b)=>rk(b.v)-rk(a.v)||a.s-b.s);
async function humanDisc(){G.sel=[];G.dm=true;
 do{await ask('',[['ok',()=>G.sel.length?`Cambiar ${G.sel.length} carta${G.sel.length>1?'s':''}`:'Elige qué tiras']])}while(!G.sel.length);/* con mus hay que tirar al menos una carta */
 G.dm=false;const s=[...G.sel];G.sel=[];return s}




async function ronda(){
 G.deck=shuf((()=>{const d=[];for(let s=0;s<4;s++)for(const v of[1,2,3,4,5,6,7,10,11,12])d.push({v,s});return d})());
 G.disc=[];G.rev=false;G.say=[];G.h=[[],[],[],[]];G.rows=[];G.ordago=false;G.has=[];G.pub={};G.pm={};G.dn=[null,null,null,null];G.cut=null;G.shown=[];G.dec={};G.musd=[];G.rnd=0;
 for(let i=0;i<4;i++)for(const p of ord(G.mano))G.h[p].push(G.deck.pop());
 G.h.forEach(sortH);
 info('');await sleep(900);
 await mus();
 for(const n of['Grande','Chica','Pares','Juego']){await playLance(n);if(G.ordago)break}
 G.rev=true;
 G.lance='Fin';await summary()}
/* ---- apuestas: importes a elegir y los dos rivales pueden responder ---- */

async function act(p,n,mode,amt,owner){
 if(p!=0){await sleep(1000);return aiAct(p,n,mode,amt)}
 if(mode=='open'){G.bet={n:2,min:2,mode:'open'};const v=await ask('',[['x','']]);G.bet=null;return v};
 if(amt=='O'){G.card=`¡${NAMES[owner]} lanza un órdago!<br>¿Quieres?`;return ask('',[['quiero','Quiero'],['no','No quiero']])}
 {G.bet={n:2,min:1,mode:'resp'};const v=await ask('',[['x','']]);G.bet=null;return v}}

/* ---- IA mas dura: simula manos posibles para estimar si gana su pareja ---- */




/* ---- lances: lo visto se cuenta al final, lo no querido se cobra al momento ---- */
async function playLance(n){
 const o=ord(G.mano),li=['Grande','Chica','Pares','Juego'].indexOf(n);G.say=[];G.lance=n;G.has=[];let el=o;
 if(n=='Pares'||n=='Juego'){
  el=o.filter(p=>n=='Pares'?pares(G.h[p]):jv(G.h[p]));G.dec[n]=el;
  if(!el.length&&n=='Pares'){G.rows.push({l:li,n,bet:'-',c:'Nadie',t:null,p:0,done:true});info('');await sleep(1800);return}
  if(!el.length){n='Punto';G.lance=n;el=o;info('');await cartel('Nadie tiene juego<br>Se juega al punto',2000)}
  else{G.has=el;info('')}
  await sleep(2200)}
 const best=el.reduce((a,b)=>str(n,G.h[b])>str(n,G.h[a])?b:a),wt=tm(best),mine=el.filter(p=>tm(p)==wt);
 const base=n=='Pares'?mine.reduce((a,p)=>a+pares(G.h[p]).t,0):n=='Juego'?mine.reduce((a,p)=>a+(sum(G.h[p])==31?3:2),0):0;
 const ts=new Set(el.map(tm));
 info('');

  /* probabilidad de que ambos rivales se retiren: su estilo (ST) ajustado por lo que han hecho en el mus (tirar 3-4 cartas = mano floja, quedarse con las 4 o cortar = mano hecha) */
  const fa=q=>{const x=ST(q);let a=(x.a+4)/(x.r+6.15);const d=G.dn&&G.dn[q];if(d>=3)a*=.55;else if(d===0)a*=1.3;if(G.cut===q)a*=1.25;return Math.min(.95,a)};
  const pf=[0,1,2,3].filter(q=>tm(q)!=t).reduce((m,q)=>m*(1-fa(q)),1);
  const bl=(n=='Grande'||n=='Chica'||n=='Punto')&&w>=.15&&w<.38&&pf>=.3&&!lead&&!(op>=32&&op>me)&&Math.random()<(.5+(P==0?.15:0))*S.bl;
  if(bl&&!pri&&!o.ordago)return'e2';

 const c=Math.max(1,G.cur||0),vd=W(0,c+Eo),sel=(amt=='O'?.1:.08+.03*amt)*S.cs-S.qt,wr=Math.max(0,w-sel-ag*.5),advr=k=>Math.max(0,wr-k*Math.min(1,3*(1-wr)));/* quien envida sabe que tiene algo: descuento por seleccion */
 if(amt=='O')return wr>vd?'quiero':'no';

 /* subir: solo con mano claramente fuerte; la 2a subida exige aun mas; 5 solo sobre apuestas pequeñas */
 if(!pri&&(G.nr||0)<2&&wr>=((G.nr||0)?.72:.6)+ag+S.rt)for(const k of[2,3,5])if(amt+k<=12&&(k<5||(amt<=2&&wr>=.88)))o['r'+k]=pa*.85*vWin(amt+k,advr(.2))+(1-pa*.85)*W(amt+Em,0)-lam*k;
 return best(o)}
async function betting(n,el){
 G.nr=0;let first=null,kind;
 for(const p of el){const a=await act(p,n,'open',0);if(a=='paso'){say(p,'Paso');continue}first=p;kind=a;break}
 if(first===null)return{t:'pass'};

 while(true){
  const rs=ord((owner+1)%4).filter(p=>el.includes(p)&&tm(p)!=tm(owner));
  let a='no',r=rs[0];
  for(let i=0;i<rs.length;i++){const q=rs[i];r=q;G.cur=cur;G.bettor=owner;a=await act(q,n,'resp',pend,owner);
